name: "📐 Erratum"
description: "DA11Y.md says something and reality disagrees: a Figma API that changed, a node property that does not exist, a criterion cited wrong."
title: "[Erratum] "
labels: ["erratum"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: "File and section."
      placeholder: "docs/en/references/figma-nodes.md, Section 4"
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What DA11Y.md says
      description: "Quote it."
    validations:
      required: true
  - type: textarea
    id: reality
    attributes:
      label: What is actually the case
      description: "And how you know."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      description: "For the Figma API: the official typings, the REST specification or Figma's documentation, with the version."
    validations:
      required: true
